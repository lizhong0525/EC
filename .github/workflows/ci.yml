name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check backend/src backend/tests
      - run: mypy backend/src/ecocompanion
      - run: pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: >-
          pytest -p pytest_cov.plugin
          --cov=ecocompanion.core
          --cov=ecocompanion.domain
          --cov=ecocompanion.agent.safety
          --cov-report=term-missing
          --cov-fail-under=85
          -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -c "from pathlib import Path; from ecocompanion.schema_export import export_schemas; export_schemas(Path('artifacts/schemas'))"
      - run: python scripts/secret_scan.py .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
