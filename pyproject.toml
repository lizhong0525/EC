[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocompanion"
version = "0.1.0"
description = "EcoTriage-Bench and ECO-SAFE companion agent research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26",
  "openai>=1.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "tenacity>=9.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
  "websockets>=15.0",
  "chess>=1.10,<2",
]

[project.optional-dependencies]
external-data = [
  "openpyxl>=3.1,<4",
]
dev = [
  "hypothesis>=6.110",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "uv==0.12.9",
  "cryptography>=43.0",
]

[project.scripts]
eco = "ecocompanion.cli:app"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
"ecocompanion.research" = ["annotation.html"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ecocompanion"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ecocompanion"]
mypy_path = "backend/src"
