<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ef">
  <title>小溟的房间 · 陪伴与游戏</title>
  <link rel="icon" href="assets/portrait.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <a class="skip-link" href="#meet">跳到正文</a>
  <header class="mast"><div class="wrap mast-inner">
    <a class="brand" href="index.html"><img src="assets/portrait.png" alt=""><span>小溟的房间</span></a>
    <nav aria-label="主导航"><a href="index.html" aria-current="page">首页</a><a href="about.html">使用指南</a></nav>
  </div></header>
  <main class="wrap">
    <section class="hero" aria-labelledby="meet">
      <div class="welcome">
        <h1 id="meet">你好，<br>我是小溟<span class="stop">。</span></h1>
        <p>今天有什么想说的？来坐一会儿。<br>也可以摆一盘棋，或者约上三位伙伴玩猜词。</p>
        <div class="actions"><a class="button" href="#conversation">读一段对话 <span aria-hidden="true">↓</span></a><a class="text-link" href="about.html">第一次来？看指南 <span aria-hidden="true">↗</span></a></div>
      </div>
      <figure class="postcard">
        <div class="night">
          <div class="sky-dots" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div>
          <i class="spark one" aria-hidden="true"></i><i class="spark two" aria-hidden="true"></i><i class="spark three" aria-hidden="true"></i>
          <div class="hill far" aria-hidden="true"></div><div class="hill near" aria-hidden="true"></div>
          <div class="landing" aria-hidden="true"></div>
          <img class="waving" src="assets/wave.png" alt="蓝发的小溟站在窗前向你挥手" width="210" height="288">
        </div>
        <figcaption><span><i aria-hidden="true"></i> 小溟 · 溟月</span><span lang="en">EcoCompanion</span></figcaption>
      </figure>
    </section>
    <div class="reading" id="start">
      <section class="conversation" aria-labelledby="conversation">
        <header class="block-head"><h2 id="conversation">聊聊今天</h2><span>对话示例</span></header>
        <dl class="dialogue">
          <dt>我</dt><dd>今天第一次去社团，坐了半天也没敢开口。</dd>
          <dt><img src="assets/portrait.png" width="32" height="32" alt="小溟"></dt><dd>第一次见面，找个开口的时机确实不容易。他们聊到什么时，你最想接一句？</dd>
          <dt>我</dt><dd>周末的棋局。其实我也想去看看。</dd>
        </dl>
        <a id="chat-guide" class="text-link" href="about.html#chat">怎样开始聊天 <span aria-hidden="true">↗</span></a>
      </section>
      <section class="game-menu" aria-labelledby="games-title">
        <header class="block-head"><h2 id="games-title">玩一局</h2><span>两种玩法</span></header>
        <a class="game" href="about.html#games"><span class="chess-icon" aria-hidden="true">♞</span><span><strong>国际象棋</strong><small>两人对弈 · 白方先行</small></span><span class="arrow" aria-hidden="true">↗</span></a>
        <a class="game" href="about.html#games"><span class="fish-icon"><img src="assets/fish-2.webp" alt=""></span><span><strong>谁是卧底</strong><small>四人猜词 · 发言与投票</small></span><span class="arrow" aria-hidden="true">↗</span></a>
        <a id="games-guide" class="text-link" href="about.html#games">怎样进入游戏 <span aria-hidden="true">↗</span></a>
      </section>
    </div>
  </main>
  <footer class="foot wrap"><span>EcoCompanion · 小溟陪伴与游戏</span><a href="about.html#credits">角色与素材署名 ↗</a></footer>
</body>
</html>
