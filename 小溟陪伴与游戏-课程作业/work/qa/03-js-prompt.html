<!doctype html><meta charset=utf-8><title>JavaScript 国际象棋练习 · 实际任务书</title><style>body{margin:36px auto;max-width:1000px;padding:0 32px;color:#172a28;background:white;font:21px/1.7 "Microsoft YaHei",sans-serif}h1{font-size:27px;margin:0 0 18px;border-bottom:1px solid #aac1b3;padding-bottom:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;padding:16px 20px;border-left:4px solid #357153;font:18px/1.65 Consolas,"Microsoft YaHei",monospace}p{margin:.75em 0}</style><h1>JavaScript 国际象棋练习 · 实际任务书</h1><p>请实现一个无需密钥的国际象棋练习页。提供一步将死的预设棋局和目标。桌面左侧方形棋盘，右侧操作、轮次及棋谱；手机棋盘在前。选子后高亮合法格，落子同步更新棋盘、棋谱、反馈，支持重开。复用验证过的棋规，鼠标和键盘经过同一判定。给出可供验收的起始摆位与解法。各阶段代码可读、正文具体、布局中没有装饰性口号。</p><p>交付与复核</p><p>各阶段独立双击打开。使用本地资产并保留署名。交付可运行初稿，通知组织者冻结版本、测试及修复。正文、资源、调试和测试输出放在课程目录中。</p>
