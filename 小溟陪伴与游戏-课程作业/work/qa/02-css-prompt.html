<!doctype html><meta charset=utf-8><title>CSS 响应式游戏大厅 · 实际任务书</title><style>body{margin:36px auto;max-width:1000px;padding:0 32px;color:#172a28;background:white;font:21px/1.7 "Microsoft YaHei",sans-serif}h1{font-size:27px;margin:0 0 18px;border-bottom:1px solid #aac1b3;padding-bottom:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f4;padding:16px 20px;border-left:4px solid #357153;font:18px/1.65 Consolas,"Microsoft YaHei",monospace}p{margin:.75em 0}</style><h1>CSS 响应式游戏大厅 · 实际任务书</h1><p>请为小溟制作独立响应式游戏大厅。沿用浅底、深绿和鱼形头像。主内容最大宽度1120px，桌面棋类和卧底两卡并排，间隔24px，窄于760px改为单列。用 CSS Grid 排棋盘，本地头像排列出四名玩家，写明人数与目标，每卡跳转本页规则。用独立样式表处理文字换行、焦点和小屏布局。</p><p>交付与复核</p><p>各阶段独立双击打开。使用本地资产并保留署名。交付可运行初稿，通知组织者冻结版本、测试及修复。正文、资源、调试和测试输出放在课程目录中。</p>
